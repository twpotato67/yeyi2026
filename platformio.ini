; 自動摺衣板 PlatformIO 設定
; 編譯：pio run
; 上傳：pio run -t upload
; 看序列輸出：pio device monitor

[env:m5stack-basic]
platform = espressif32@6.7.0
board = m5stack-core-esp32
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
; 中文字型比較大，改用較大的程式分區
board_build.partitions = huge_app.csv
lib_deps =
    m5stack/M5Unified@^0.2.2
